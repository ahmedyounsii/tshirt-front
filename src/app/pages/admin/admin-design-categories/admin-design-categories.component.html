<section class="panel">
  <header class="panel-header">
    <div>
      <h2 class="panel-title">{{ "common.categories" | translate }}</h2>
      <p class="panel-subtitle">
        {{ "admin.categoriesSubtitle" | translate }}
      </p>
    </div>
  </header>

  <form class="add-row" (ngSubmit)="addCategory()">
    <input
      class="app-input"
      type="text"
      name="categoryLabel"
      [(ngModel)]="categoryLabel"
      [placeholder]="'admin.newCategoryPlaceholder' | translate"
    />
    <button
      type="submit"
      class="app-btn"
      [disabled]="!categoryLabel.trim() || addingCategory"
    >
      <i [class]="addingCategory ? 'sp-icon sp-spin sp-loading' : 'sp-icon sp-add'" aria-hidden="true"></i>
      <span>{{ 'admin.addCategory' | translate }}</span>
    </button>
  </form>

  <app-search-input
    [value]="categorySearch"
    (valueChange)="categorySearch = $event; onCategorySearch()"
    [placeholder]="'admin.searchCategories' | translate"
  />

  <div class="category-grid">
    @if (categoriesLoading) {
      @for (i of [1, 2, 3, 4, 5, 6]; track i) {
        <app-skeleton width="100%" height="88px" />
      }
    } @else {
      @for (category of categories; track category._id) {
        <app-category-card
          [category]="category"
          [deleting]="deletingCategoryId === category._id"
          (open)="openCategoryDesigns($event)"
          (add)="addDesignToCategory($event)"
          (remove)="deleteCategory($event)"
        />
      } @empty {
        <app-empty
          icon="sp-icon sp-folder-open"
          [title]="'admin.noCategories' | translate"
        />
      }
    }
  </div>
</section>

@if (toast) {
  <app-admin-toast [toast]="toast" />
}
