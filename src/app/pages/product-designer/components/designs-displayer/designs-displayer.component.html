<app-panel-header
  [title]="'designer.graphics' | translate"
  [description]="'designer.graphicsDescription' | translate"
  (doClose)="doClose.emit()"
/>

<span class="app-input-icon designs-displayer-search">
  <i class="sp-icon sp-search-1" aria-hidden="true"></i>
  <input
    class="app-input"
    type="text"
    [(ngModel)]="inputText"
    (ngModelChange)="inputChange()"
    [placeholder]="'designer.searchGraphics' | translate"
  />
</span>

<app-designs-displayer-categories
  [selectedCategory]="selectedCategory"
  (doSelectDesignCategory)="selectCategory($event)"
/>

<app-designs-dispalyer-items
  (doSelectDesign)="selectDesign($event)"
  [selectedCategory]="selectedCategory"
  [search]="search"
/>
