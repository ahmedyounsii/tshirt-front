<div class="designs-displayer-body" #designsBody>
  @if (loading) {
    @for (i of skeletons; track i) {
      <p-skeleton width="100%" height="90px" />
    }
  } @else {
    @for (design of designsList; track design._id) {
      <div
        class="designs-displayer-body-item draggable"
        (click)="selectDesign(design)"
      >
        <img
          [src]="design.url"
          class="designs-displayer-body-item-img"
          [alt]="design.label || 'design'"
          loading="lazy"
          decoding="async"
        />
      </div>
    } @empty {
      <app-empty [title]="'designer.noGraphics' | translate" />
    }
    @if (loadingMore) {
      <p-skeleton width="100%" height="90px" />
      <p-skeleton width="100%" height="90px" />
    }
  }
</div>
