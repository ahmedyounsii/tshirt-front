<nav class="admin-nav">
  <button
    class="admin-nav-item"
    [class.active]="active === 'categories'"
    (click)="activeChange.emit('categories')"
  >
    <i class="pi pi-folder"></i>
    <span>{{ 'common.categories' | translate }}</span>
    <span class="admin-nav-count">{{ categoriesCount }}</span>
  </button>
  <button
    class="admin-nav-item"
    [class.active]="active === 'designs'"
    (click)="activeChange.emit('designs')"
  >
    <i class="pi pi-images"></i>
    <span>{{ 'common.designs' | translate }}</span>
    <span class="admin-nav-count">{{ designsCount }}</span>
  </button>
  <button
    class="admin-nav-item"
    [class.active]="active === 'templates'"
    (click)="activeChange.emit('templates')"
  >
    <i class="pi pi-box"></i>
    <span>{{ 'admin.templates.title' | translate }}</span>
    <span class="admin-nav-count">{{ templatesCount }}</span>
  </button>
</nav>
