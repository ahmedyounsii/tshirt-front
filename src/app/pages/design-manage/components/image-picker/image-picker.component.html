@if (!file) {
  <label
    class="dropzone"
    [class.dragging]="isDragging"
    [class.preparing]="preparing"
    [attr.aria-busy]="preparing"
    (dragenter)="onDragOver($event)"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
  >
    <input
      type="file"
      [accept]="acceptedTypes"
      [disabled]="preparing"
      (change)="onFileSelected($event)"
      hidden
    />
    @if (preparing) {
      <i class="pi pi-spinner pi-spin"></i>
      <strong>{{ 'upload.processing' | translate }}</strong>
    } @else {
      <i class="pi pi-cloud-upload"></i>
      <strong>{{ 'admin.dropImage' | translate }}</strong>
      <span>{{ 'admin.dropHint' | translate }}</span>
    }
    <span>{{ 'upload.hint' | translate: { size: maxSizeMb } }}</span>
  </label>
} @else {
  <div class="preview">
    <div
      class="preview-img"
      [style.backgroundImage]="'url(' + previewUrl + ')'"
    ></div>
    <div class="preview-info">
      <div class="preview-name">{{ file.name }}</div>
      <div class="preview-size">{{ formatSize(file.size) }}</div>
      <button
        pButton
        size="small"
        severity="danger"
        [text]="true"
        class="remove-file-btn"
        (click)="removeFile()"
        icon="pi pi-trash"
        [label]="'common.remove' | translate"
      ></button>
    </div>
  </div>
}
