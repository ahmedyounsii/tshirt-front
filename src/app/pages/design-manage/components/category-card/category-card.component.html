<div class="category-card" (click)="open.emit(category)">
  <app-icon size="md" icon="sp-icon sp-folder-1" />
  <div class="category-card-body">
    <div class="category-card-label">{{ category.label }}</div>
    <div class="category-card-count">
      {{
        "admin.designsCount"
          | translate: { count: category.designs?.length || 0 }
      }}
    </div>
  </div>
  <div class="category-card-actions">
    <button
      class="app-btn app-btn-sm app-btn-secondary app-btn-outlined app-btn-icon-only"
      [title]="'admin.addToCategory' | translate"
      (click)="onAction($event, add)"
    >
      <i class="sp-icon sp-add" aria-hidden="true"></i>
    </button>
    <button
      class="app-btn app-btn-sm app-btn-danger app-btn-outlined app-btn-icon-only"
      [title]="'admin.deleteCategory' | translate"
      [disabled]="deleting"
      (click)="onAction($event, remove)"
    >
      <i [class]="deleting ? 'sp-icon sp-loading sp-spin' : 'sp-icon sp-trash-1'" aria-hidden="true"></i>
    </button>
  </div>
</div>
