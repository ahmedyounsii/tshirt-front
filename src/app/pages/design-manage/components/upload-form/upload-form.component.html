<div class="upload-header">
  <h3>Add new design</h3>
  <button
    pButton
    size="small"
    severity="secondary"
    [text]="true"
    (click)="closed.emit()"
    icon="pi pi-times"
  ></button>
</div>

<div class="upload-body">
  <app-image-picker
    (fileChange)="onFileChange($event)"
    (rejected)="notify.emit({ type: 'error', message: $event })"
  />

  <div class="upload-fields">
    <div class="field">
      <label for="uploadCategory">Category</label>
      <p-select
        inputId="uploadCategory"
        [options]="categories"
        [ngModel]="categoryId"
        (ngModelChange)="onCategoryChange($event)"
        optionLabel="label"
        optionValue="_id"
        placeholder="Select a category"
        [filter]="categories.length > 8"
        filterBy="label"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="field">
      <label for="designLabel">Label</label>
      <input
        pInputText
        id="designLabel"
        type="text"
        [(ngModel)]="label"
        placeholder="Design name..."
      />
    </div>
    <button
      pButton
      size="small"
      [fluid]="true"
      class="upload-submit-btn"
      [disabled]="!canUpload"
      (click)="upload()"
      [icon]="uploading ? 'pi pi-spinner pi-spin' : 'pi pi-upload'"
      [label]="uploading ? 'Uploading...' : 'Upload design'"
    ></button>
  </div>
</div>
