<div class="upload-header">
  <h3>{{ "admin.addNewDesign" | translate }}</h3>
  <button
    pButton
    size="small"
    severity="secondary"
    [text]="true"
    (click)="closed.emit()"
    icon="pi pi-times"
  ></button>
</div>

<div class="upload-body">
  <app-image-picker
    (fileChange)="onFileChange($event)"
    (rejected)="notify.emit({ type: 'error', message: $event })"
  />

  <div class="upload-fields">
    <div class="field">
      <label for="uploadCategory">{{ "common.category" | translate }}</label>
      <p-select
        inputId="uploadCategory"
        [options]="categories"
        [ngModel]="categoryId"
        (ngModelChange)="onCategoryChange($event)"
        optionLabel="label"
        optionValue="_id"
        [placeholder]="'common.selectCategory' | translate"
        [filter]="categories.length > 8"
        filterBy="label"
        appendTo="body"
        styleClass="w-full"
      />
    </div>
    <div class="field">
      <label for="designLabel">{{ "common.label" | translate }}</label>
      <input
        pInputText
        id="designLabel"
        type="text"
        [(ngModel)]="label"
        [placeholder]="'common.designNamePlaceholder' | translate"
      />
    </div>
    <button
      pButton
      [fluid]="true"
      class="upload-submit-btn"
      [disabled]="!canUpload"
      (click)="upload()"
      [icon]="uploading ? 'pi pi-spinner pi-spin' : 'pi pi-upload'"
      [label]="
        (rendering
          ? 'grunge.rendering'
          : uploading
            ? 'admin.uploading'
            : 'admin.uploadDesign'
        ) | translate
      "
    ></button>
  </div>
</div>

@if (file) {
  <app-grunge-editor class="upload-grunge" [file]="file" />
}
