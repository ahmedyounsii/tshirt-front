@if (showHeader) {
  <div class="upload-header">
    <h3>{{ "admin.addNewDesign" | translate }}</h3>
    <button
      class="app-btn app-btn-sm app-btn-secondary app-btn-text app-btn-icon-only"
      (click)="closed.emit()"
    >
      <i class="pi pi-times" aria-hidden="true"></i>
    </button>
  </div>
}

<div class="upload-body">
  <app-image-picker
    (fileChange)="onFileChange($event)"
    (rejected)="notify.emit({ type: 'error', message: $event })"
  />

  <div class="upload-fields">
    <div class="field">
      <label for="uploadCategory">{{ "common.categories" | translate }}</label>
      <app-select
        [multiple]="true"
        inputId="uploadCategory"
        [options]="categories"
        [ngModel]="categoryIds"
        (ngModelChange)="onCategoriesChange($event)"
        optionLabel="label"
        optionValue="_id"
        [placeholder]="'common.selectCategories' | translate"
        [filter]="categories.length > 8"
        [fluid]="true"
      />
    </div>
    <div class="field">
      <label for="designLabel">{{ "common.label" | translate }}</label>
      <input
        class="app-input"
        id="designLabel"
        type="text"
        [(ngModel)]="label"
        [placeholder]="'common.designNamePlaceholder' | translate"
      />
    </div>
    <div class="field">
      <label for="designTags">{{ "common.tags" | translate }}</label>
      <app-product-tags inputId="designTags" [(tags)]="tags" />
    </div>
    <button
      class="app-btn app-btn-block upload-submit-btn"
      [disabled]="!canUpload"
      (click)="upload()"
    >
      <i [class]="uploading ? 'pi pi-spinner pi-spin' : 'pi pi-upload'" aria-hidden="true"></i>
      <span>{{ (rendering ? 'grunge.rendering' : uploading ? 'admin.uploading' : 'admin.uploadDesign' ) | translate }}</span>
    </button>
  </div>
</div>

@if (file) {
  <app-grunge-editor class="upload-grunge" [file]="file" />
}
