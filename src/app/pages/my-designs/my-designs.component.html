<!-- The gallery only loads once the user (their id) is known -->
@if (auth.user(); as user) {
  <app-designs-gallery
    [title]="'common.mySharedDesigns'"
    [categories]="categories"
    [createdBy]="user._id"
    [openInDesigner]="true"
    emptyTitle="designsGallery.noShared"
    emptyButtonLabel="designsGallery.shareFirst"
    (emptyAction)="share()"
    (notify)="showToast($event)"
  >
    <a
      class="app-btn"
      galleryActions
      routerLink="/my-designs/new"
    >
      <i class="sp-icon sp-upload-1" aria-hidden="true"></i>
      <span>{{ 'designsGallery.shareDesign' | translate }}</span>
    </a>
  </app-designs-gallery>
}

@if (toast) {
  <app-admin-toast [toast]="toast" />
}
