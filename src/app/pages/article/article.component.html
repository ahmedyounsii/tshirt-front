<h5>Add Category</h5>
<input [(ngModel)]="categoryLabel" type="text" />
<button (click)="addCategory()">ADD</button>
<h5>Add Design</h5>
<p-select
  [options]="categories"
  [(ngModel)]="selectedCategory"
  optionLabel="name"
  placeholder="Select a City"
  class="w-full md:w-56"
  optionLabel="label"
/>
@if(selectedCategory) {
<input type="text" [(ngModel)]="designLabel" />
<input type="file" (change)="onFileSelected($event)" accept="image/*" />
}
