<div class="orders">
  <header class="orders-top">
    <h1>{{ "orders.title" | translate }}</h1>
    <p>{{ "orders.subtitle" | translate }}</p>
  </header>

  @if (loading()) {
    <div class="orders-list">
      @for (i of [1, 2, 3]; track i) {
        <app-skeleton height="96px" />
      }
    </div>
  } @else if (failed()) {
    <app-empty
      icon="sp-icon sp-warning-triangle"
      [title]="'orders.error' | translate"
      [buttonLabel]="'orders.retry' | translate"
      buttonIcon="sp-icon sp-refresh"
      (doAction)="load()"
    />
  } @else if (!orders().length) {
    <app-empty
      icon="sp-icon sp-box-1"
      [title]="'orders.empty.title' | translate"
      [description]="'orders.empty.text' | translate"
      [buttonLabel]="'orders.empty.action' | translate"
      buttonIcon="sp-icon sp-bag-1"
      (doAction)="goToStore()"
    />
  } @else {
    <ul class="orders-list">
      @for (o of orders(); track o._id) {
        <li>
          <app-order-card
            [order]="o"
            [expanded]="open().has(o._id)"
            (toggle)="toggle(o._id)"
          />
        </li>
      }
    </ul>

    <div class="orders-actions">
      <a
        class="app-btn"
        routerLink="/stores"
      >
        <i class="sp-icon sp-bag-1" aria-hidden="true"></i>
        <span>{{ 'checkout.success.continue' | translate }}</span>
      </a>
    </div>
  }
</div>
