@if (!isEditMode) {
<app-panel-header
  title="Text"
  description="Write a text and style its font, color and spacing."
  (doClose)="doClose.emit()"
/>
}

<div class="text-edition-body">
  <textarea
    pTextarea
    class="text-input"
    rows="2"
    [autoResize]="true"
    [fluid]="true"
    placeholder="Type your text..."
    [(ngModel)]="style.content"
  ></textarea>

  <div class="text-edition-section">
    <span class="text-edition-label">Font</span>
    <p-select
      class="font-select"
      [options]="fonts"
      [(ngModel)]="style.fontFamily"
      [filter]="true"
      filterPlaceholder="Search a font..."
      placeholder="Select a font"
      [fluid]="true"
      appendTo="body"
    >
      <ng-template #selectedItem let-font>
        <span [style.fontFamily]="font">{{ font }}</span>
      </ng-template>
      <ng-template #item let-font>
        <span class="font-option" [style.fontFamily]="font">{{ font }}</span>
      </ng-template>
    </p-select>
  </div>

  <div class="text-edition-section">
    <span class="text-edition-label">Style</span>
    <div class="style-actions">
      <button
        pButton size="small" severity="secondary" [outlined]="true"
        class="style-btn bold"
        [ngClass]="{ selected: style.bold }"
        (click)="toggle('bold')"
      >
        B
      </button>
      <button
        pButton size="small" severity="secondary" [outlined]="true"
        class="style-btn italic"
        [ngClass]="{ selected: style.italic }"
        (click)="toggle('italic')"
      >
        I
      </button>
      <button
        pButton size="small" severity="secondary" [outlined]="true"
        class="style-btn underline"
        [ngClass]="{ selected: style.underline }"
        (click)="toggle('underline')"
      >
        U
      </button>
      <span class="divider"></span>
      @for (align of aligns; track align) {
      <button
        pButton size="small" severity="secondary" [outlined]="true"
        class="style-btn"
        [ngClass]="{ selected: style.align === align }"
        (click)="style.align = align"
        [icon]="'pi pi-align-' + align"
      ></button>
      }
    </div>
  </div>

  <div class="text-edition-section">
    <span class="text-edition-label">Color</span>
    <div class="color-list">
      @for (color of colors; track color) {
      <div
        class="color-item"
        [ngClass]="{ selected: style.color === color }"
        [style.background]="color"
        (click)="style.color = color"
      ></div>
      }
      <label class="color-item custom" title="Custom color">
        <i class="pi pi-palette"></i>
        <input type="color" [(ngModel)]="style.color" />
      </label>
    </div>
  </div>

  @if (!isEditMode) {
  <!-- In edit mode the font size is handled by the design edition sliders -->
  <div class="config-slider">
    <span>Size</span>
    <p-slider
      [min]="10"
      [max]="120"
      [step]="1"
      [(ngModel)]="style.fontSize"
    ></p-slider>
    <span class="config-slider-value">{{ style.fontSize }}</span>
  </div>
  }

  <div class="config-slider">
    <span>Spacing</span>
    <p-slider
      [min]="-5"
      [max]="30"
      [step]="0.5"
      [(ngModel)]="style.letterSpacing"
    ></p-slider>
    <span class="config-slider-value">{{ style.letterSpacing }}</span>
  </div>

  @if (!isEditMode) {
  <button
    pButton
    size="small"
    class="add-text-btn"
    [disabled]="!style.content.trim()"
    (click)="addText()"
    icon="pi pi-plus"
    label="Add Text"
  ></button>
  }
</div>
