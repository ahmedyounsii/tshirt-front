<app-bottom-drawer [mobileOnly]="true" (doClose)="doUnselectDesignObject.emit()" #drawer>
  <div class="designer-config">
    <div class="designer-config-body">
      @switch (selectedConfigCategory.id) { @case ('select-design') {
      <app-designs-displayer
        (doClose)="drawer.close()"
        (doSelectDesign)="selectDesign($event)"
      />
      } @case ('upload') {
      <app-upload-design
        (doClose)="drawer.close()"
        (doUpload)="doUpload($event)"
      />
      } @case ('product-edition') {
      <app-product-edition (doClose)="drawer.close()" />
      } @case('text-edition') {
      <app-text-edition
        (doClose)="drawer.close()"
        (doAddText)="doAddText.emit($event)"
      />
      } }
    </div>
  </div>
</app-bottom-drawer>
