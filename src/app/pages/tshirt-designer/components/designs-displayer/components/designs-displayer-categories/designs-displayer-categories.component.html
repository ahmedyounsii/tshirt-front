<div class="designer-config-header">
  <div class="designer-config-header-title">Design Edition</div>
  <button (click)="doClose.emit()" class="only-icon ms-auto">
    <i class="pi pi-times"></i>
  </button>
</div>
<div class="designs-displayer-search">
  <input
    type="text"
    [(ngModel)]="inputValue"
    (ngModelChange)="inputChange()"
    pInputText
    [placeholder]="'Search Category...'"
  />
</div>
@if(loading) {
<p-skeleton width="100%" height="45px" />
<p-skeleton width="100%" height="40px" />
<p-skeleton width="100%" height="40px" />
<p-skeleton width="100%" height="40px" />
<p-skeleton width="100%" height="40px" />
} @else {
<div class="designs-categories">
  <div (click)="selectCategory('all_designs')" class="designs-categories-item">
    <div class="designs-categories-item-label">All</div>
    <div class="designs-categories-item-action">
      <i class="pi pi-arrow-right"></i>
    </div>
  </div>
  @for (item of designCategories; track $index) {
  <div (click)="selectCategory(item._id)" class="designs-categories-item">
    <div class="designs-categories-item-label">
      {{ item.label }}
    </div>
    <div class="designs-categories-item-count tag">
      {{ item.designs?.length || 0 }}
    </div>
    <div class="designs-categories-item-action">
      <i class="pi pi-arrow-right"></i>
    </div>
  </div>
  }
</div>
}
