<div class="designer-config-header">
  <div class="designer-config-header-title">Design Edition</div>
  <button (click)="doClose.emit()" class="only-icon ms-auto">
    <i class="pi pi-times"></i>
  </button>
</div>
<div class="designs-displayer-search">
  <input
    [(ngModel)]="inputText"
    (ngModelChange)="inputChange()"
    type="text"
    pInputText
    [placeholder]="'Search Design...'"
  />
</div>

<div class="designs-displayer-body">
  @if(loading) {
  <p-skeleton width="100%" height="90px" />
  <p-skeleton width="100%" height="90px" />
  <p-skeleton width="100%" height="90px" />
  <p-skeleton width="100%" height="90px" />
  <p-skeleton width="100%" height="90px" />
  <p-skeleton width="100%" height="90px" />
  } @else { @for (design of designsList; track $index) {
  <div
    class="designs-displayer-body-item draggable"
    (click)="selectDesign(design)"
  >
    <img
      [src]="design.url"
      class="designs-displayer-body-item-img"
      alt="design"
    />
  </div>
  } }
</div>
@if(designsList.length > 0) {
<p-paginator
  (onPageChange)="onPageChange($event)"
  [first]="page"
  [rows]="size"
  [totalRecords]="count"
/>
}
