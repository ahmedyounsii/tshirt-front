<div class="config-layout-action center">
  <button
    pButton
    size="small"
    severity="secondary"
    [outlined]="true"
    (click)="centerItem()"
    icon="pi pi-align-center"
  ></button>
  <span>Center</span>
</div>
<div
  [ngClass]="{ selected: selectedDesignFlipX }"
  class="config-layout-action filpX"
>
  <button
    pButton
    size="small"
    severity="secondary"
    [outlined]="true"
    (click)="flipItemX()"
    icon="pi pi-arrow-right-arrow-left"
  ></button>
  <span>Flip X</span>
</div>
<div
  [ngClass]="{ selected: selectedDesignFlipY }"
  class="config-layout-action filpY"
>
  <button
    pButton
    size="small"
    severity="secondary"
    [outlined]="true"
    (click)="flipItemY()"
    icon="pi pi-arrow-right-arrow-left"
  ></button>
  <span>Flip Y</span>
</div>
<div
  [ngClass]="{ selected: selectedItem === 'translateX' }"
  class="config-layout-action translateX"
>
  <button
    pButton
    size="small"
    severity="secondary"
    [outlined]="true"
    (click)="selectItem('translateX')"
    icon="pi pi-arrows-h"
  ></button>
  <span>translate X</span>
</div>
<div
  [ngClass]="{ selected: selectedItem === 'translateY' }"
  class="config-layout-action translateY"
>
  <button
    pButton
    size="small"
    severity="secondary"
    [outlined]="true"
    (click)="selectItem('translateY')"
    icon="pi pi-arrows-v"
  ></button>
  <span>Translate Y</span>
</div>
<div
  [ngClass]="{ selected: selectedItem === 'rotate' }"
  class="config-layout-action rotate"
>
  <button
    pButton
    size="small"
    severity="secondary"
    [outlined]="true"
    (click)="selectItem('rotate')"
    icon="pi pi-refresh"
  ></button>
  <span>Rotate</span>
</div>
<div
  [ngClass]="{ selected: selectedItem === 'scale' }"
  class="config-layout-action scale"
>
  <button
    pButton
    size="small"
    severity="secondary"
    [outlined]="true"
    (click)="selectItem('scale')"
    icon="pi pi-arrow-up-right-and-arrow-down-left-from-center"
  ></button>
  <span>Scale</span>
</div>
<div class="config-layout-action delete">
  <button
    pButton
    size="small"
    severity="danger"
    [outlined]="true"
    (click)="removeItem()"
    icon="pi pi-trash"
  ></button>
  <span>Remove</span>
</div>
