<!-- Nothing but the mask while the browser starts (see booting): the router outlet
     shows the settled page once it is created -->
@if (!isBrowser || !booting()) {
  <app-route-progress />
  <!-- Pages standing alone, without the header: the maintenance page (nothing to navigate
       to while the shop is down), the login (its own logo leads back home) and the
       admin view (its top bar replaces it) -->
  @if (!standalonePage() && !adminView.isAdminView()) {
    <app-header />
  }
  <!-- Admin view: the admin layout brings its own sidebar and top bar, edge to edge -->
  <div
    class="main-layout"
    [class]="routeClass()"
    [class.admin-view]="adminView.isAdminView()"
  >
    <router-outlet />
  </div>
  <app-confirm-dialog />
  <app-shop-now-dialog />
  <!-- Last: covers the dialogs and the cart drawer it's opened from -->
  @if (previewer.current(); as p) {
    <app-img-previewer
      (doClosePreviewer)="previewer.close()"
      [front]="p.front"
      [back]="p.back"
      [side]="p.side"
    />
  }
}
@if (booting()) {
  <app-loader-mask [opaque]="true" />
} @else if (loader.visible()) {
  <app-loader-mask />
}
