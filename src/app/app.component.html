<!-- @if (routeClass() === 'route-home') {
  <app-free-shipping-header />
} -->
<app-route-progress />
<app-header />
<div class="main-layout" [class]="routeClass()">
  <router-outlet />
</div>
<app-confirm-dialog />
<app-shop-now-dialog />
<!-- Last: covers the dialogs and the cart drawer it's opened from -->
@if (previewer.current(); as p) {
  <app-img-previewer
    (doClosePreviewer)="previewer.close()"
    [front]="p.front"
    [back]="p.back"
    [side]="p.side"
  />
}
@if (loader.visible()) {
  <app-loader-mask />
}
