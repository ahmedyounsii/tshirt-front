<div [routerLink]="['/']" class="app-header-left"></div>
<div class="app-header-right">
  @if (auth.isAdmin()) {
    @for (action of adminActions; track action.id) {
      <p-button
        class="app-header-action"
        [rounded]="true"
        severity="secondary"
        outlined
        size="small"
        [label]="action.label | translate"
        [icon]="action.icon"
        [ariaLabel]="action.label | translate"
        [routerLink]="[action.link]"
      />
    }
  }
  <p-button
    size="small"
    [label]="'language.next' | translate"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    [ariaLabel]="'language.switch' | translate"
    (onClick)="language.toggle()"
  />
  <p-button
    size="small"
    [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    [ariaLabel]="
      (themeService.isDark() ? 'header.lightMode' : 'header.darkMode')
        | translate
    "
    (onClick)="themeService.toggle()"
  />
  <app-cart-summary />
  <app-header-account />
</div>
