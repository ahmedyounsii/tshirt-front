<div [routerLink]="['/']" class="app-header-left"></div>
<div class="app-header-right">
  @if (auth.isAdmin()) {
    @for (action of adminActions; track action.id) {
      <p-button
        class="app-header-action"
        size="small"
        [label]="action.label"
        [icon]="action.icon"
        [ariaLabel]="action.label"
        [routerLink]="[action.link]"
      />
    }
  }
  <p-button
    size="small"
    [icon]="themeService.isDark() ? 'pi pi-sun' : 'pi pi-moon'"
    [rounded]="true"
    [text]="true"
    severity="secondary"
    [ariaLabel]="
      themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'
    "
    (onClick)="themeService.toggle()"
  />
  <app-cart-summary />
  <app-header-account />
</div>
