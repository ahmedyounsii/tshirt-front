<app-dialog
  #dialog
  [open]="!!design"
  (openChange)="!$event && close()"
  [closable]="!saving"
  [header]="'designsGallery.editDesign' | translate"
  width="460px"
>
  @if (design) {
    <form class="dc" (ngSubmit)="save()">
      <div class="dc-design">
        <img class="dc-img" [src]="design.url" [alt]="design.label || ''" />
        <span class="dc-label">{{ design.label }}</span>
      </div>

      <div class="dc-field">
        <label for="designLabel">{{ "common.name" | translate }}</label>
        <input
          class="app-input"
          id="designLabel"
          name="label"
          type="text"
          [(ngModel)]="label"
          [placeholder]="'common.designNamePlaceholder' | translate"
        />
        @if (!label.trim()) {
          <small class="dc-hint">{{ "designsGallery.nameRequired" | translate }}</small>
        }
      </div>

      <div class="dc-field">
        <label for="designTags">{{ "common.tags" | translate }}</label>
        <app-product-tags inputId="designTags" [(tags)]="tags" />
      </div>

      <div class="dc-field">
        <label for="designCategories">{{ "common.categories" | translate }}</label>
        <app-select
          [multiple]="true"
          inputId="designCategories"
          name="categoryIds"
          [options]="categories"
          [(ngModel)]="categoryIds"
          optionLabel="label"
          optionValue="_id"
          [placeholder]="'common.selectCategories' | translate"
          [filter]="categories.length > 8"
          [fluid]="true"
        />
      </div>

      @if (failed) {
        <p class="dc-error" role="alert">
          <i class="sp-icon sp-warning-triangle"></i>
          {{ "designsGallery.designFailed" | translate }}
        </p>
      }
    </form>
  }

  <div dialogFooter class="dialog-actions">
    <button
      type="button"
      class="app-btn app-btn-secondary app-btn-text"
      [disabled]="saving"
      (click)="close()"
    >
      <span>{{ 'common.cancel' | translate }}</span>
    </button>
    <button
      type="button"
      class="app-btn"
      [disabled]="saving || !canSave"
      (click)="save()"
    >
      <i [class]="saving ? 'sp-icon sp-spin sp-loading' : 'sp-icon sp-tick'" aria-hidden="true"></i>
      <span>{{ 'common.save' | translate }}</span>
    </button>
  </div>
</app-dialog>
