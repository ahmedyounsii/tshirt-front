<div
  class="card-info"
  [class]="cardClass"
  [class.clickable]="link"
  [routerLink]="link"
>
  <span class="card-info-glow"></span>

  <div class="card-info-content">
    @if (eyebrow) {
      <app-tag
        class="card-info-eyebrow"
        variant="glass"
        size="md"
        uppercase
        [icon]="icon ?? ''"
      >
        {{ eyebrow }}
      </app-tag>
    }
    @if (headingLevel === 1) {
      <h1 class="card-info-content-title">{{ title }}</h1>
    } @else {
      <h2 class="card-info-content-title">{{ title }}</h2>
    }
    <div class="card-info-content-desc">{{ description }}</div>
    @if (ctaLabel && link) {
      <span class="card-info-cta">
        {{ ctaLabel }}
        <i class="sp-icon sp-arrow-right"></i>
      </span>
    }
  </div>

  <!-- A projected [cardImg] element replaces the image -->
  <div class="card-info-img">
    <ng-content select="[cardImg]">
      <img [src]="imgUrl" [alt]="imgAlt" />
    </ng-content>
  </div>
</div>
