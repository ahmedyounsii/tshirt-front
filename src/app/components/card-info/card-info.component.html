<div
  class="card-info"
  [class]="cardClass"
  [class.clickable]="link"
  [routerLink]="link"
>
  <span class="card-info-glow"></span>

  <div class="card-info-content">
    @if (eyebrow) {
      <span class="card-info-eyebrow">
        @if (icon) {
          <i [class]="icon"></i>
        }
        {{ eyebrow }}
      </span>
    }
    <div class="card-info-content-title">{{ title }}</div>
    <div class="card-info-content-desc">{{ description }}</div>
    @if (ctaLabel && link) {
      <span class="card-info-cta">
        {{ ctaLabel }}
        <i class="pi pi-arrow-right"></i>
      </span>
    }
  </div>

  <div class="card-info-img">
    <img [src]="imgUrl" alt="" />
  </div>
</div>
