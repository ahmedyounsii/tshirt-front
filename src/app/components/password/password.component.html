<div class="field">
  <input
    class="app-input"
    [class.with-toggle]="toggleMask"
    [type]="visible() ? 'text' : 'password'"
    [attr.id]="inputId || null"
    [attr.autocomplete]="autocomplete"
    [attr.aria-describedby]="feedback && value() && inputId ? inputId + '-strength' : null"
    [placeholder]="placeholder"
    [value]="value()"
    [disabled]="disabled"
    (input)="onInput($event)"
    (blur)="blur()"
  />
  @if (toggleMask) {
    <button
      type="button"
      class="toggle"
      [attr.aria-label]="(visible() ? 'auth.hidePassword' : 'auth.showPassword') | translate"
      [attr.aria-pressed]="visible()"
      [title]="(visible() ? 'auth.hidePassword' : 'auth.showPassword') | translate"
      [disabled]="disabled"
      (click)="visible.set(!visible())"
    >
      <i [class]="visible() ? 'pi pi-eye-slash' : 'pi pi-eye'" aria-hidden="true"></i>
    </button>
  }
</div>

@if (feedback && value()) {
  <div
    class="strength"
    [attr.id]="inputId ? inputId + '-strength' : null"
    [attr.data-strength]="strength()"
    aria-live="polite"
  >
    <span class="meter" aria-hidden="true"><span></span></span>
    <span class="strength-label">{{ "auth.strength." + strength() | translate }}</span>
  </div>
}
