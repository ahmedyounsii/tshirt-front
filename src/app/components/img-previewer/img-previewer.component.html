<!-- Native modal: in the top layer, over the dialogs it is opened from -->
<dialog #overlay class="previewer" (cancel)="onCancel($event)">
  @if (show3d) {
    <!-- Deferred: three.js is only downloaded the first time the 3D view is opened -->
    @defer (on immediate) {
      <app-product-3d-viewer
        #viewer3d
        class="previewer-3d"
        [templateUrl]="view.templateUrl!"
        [designs]="view.designs"
        [printArea]="view.printArea"
      />
    } @placeholder {
      <div class="previewer-loader">
        <i class="sp-icon sp-loading sp-spin"></i>
        <span>{{ "common.loading3d" | translate }}</span>
      </div>
    }
  } @else if (view.templateUrl && view.printArea) {
    <!-- Product being designed: template + designs drawn on a canvas -->
    <app-product-2d-viewer
      class="previewer-2d"
      [templateUrl]="view.templateUrl"
      [designs]="view.designs"
      [printArea]="view.printArea"
      [style.transform]="'scale(' + zoomLevel + ')'"
    />
  } @else if (view.preview) {
    <!-- crossorigin: lets the image be drawn on a canvas for the PNG download -->
    <img
      #previewImg
      [src]="view.preview"
      alt=""
      crossorigin="anonymous"
      (load)="imageLoaded = true"
      [style.transform]="'scale(' + zoomLevel + ')'"
    />
  } @else {
    <div class="previewer-loader">
      <i class="sp-icon sp-loading sp-spin"></i>
      <span>{{ "previewer.loading2d" | translate }}</span>
    </div>
  }

  <div class="previewer-action">
    @if (back) {
      <app-selectbutton
        class="side-switch"
        [options]="sides"
        [value]="side"
        (valueChange)="side = $event"
        [ariaLabel]="'previewer.side' | translate"
      />
    }
    @if (view.templateUrl) {
      <button
        class="app-btn app-btn-sm app-btn-secondary app-btn-outlined"
        (click)="view3d = !view3d"
      >
        <i
          [class]="view3d ? 'sp-icon sp-image-1' : 'sp-icon sp-box-1'"
          aria-hidden="true"
        ></i>
        <span>{{ view3d ? "2D" : "3D" }}</span>
      </button>
    }
    <button
      class="app-btn app-btn-sm app-btn-secondary app-btn-outlined app-btn-icon-only"
      (click)="download()"
      [disabled]="!canDownload"
      [attr.aria-label]="'previewer.download' | translate"
      [attr.title]="'previewer.download' | translate"
    >
      <i class="sp-icon sp-download-2" aria-hidden="true"></i>
    </button>
    @if (!show3d) {
      <button
        class="app-btn app-btn-sm app-btn-secondary app-btn-outlined previewer-action-zoom-btn app-btn-icon-only"
        (click)="zoomOut()"
      >
        <i class="sp-icon sp-search-1-zoom-out" aria-hidden="true"></i>
      </button>
      <button
        class="app-btn app-btn-sm app-btn-secondary app-btn-outlined previewer-action-zoom-btn app-btn-icon-only"
        (click)="zoomIn()"
      >
        <i class="sp-icon sp-search-1-zoom-in" aria-hidden="true"></i>
      </button>
    }
    <button
      class="app-btn app-btn-sm app-btn-danger app-btn-outlined app-btn-icon-only"
      (click)="doClosePreviewer.emit()"
    >
      <i class="sp-icon sp-close" aria-hidden="true"></i>
    </button>
  </div>
</dialog>
