@let request = confirm.request();
<app-dialog
  [header]="request?.header ?? ''"
  [open]="!!request"
  (openChange)="onOpenChange($event)"
  width="360px"
>
  <p class="confirm-text">{{ request?.message }}</p>
  <div dialogFooter class="dialog-actions">
    <button
      class="app-btn app-btn-sm app-btn-secondary app-btn-text"
      (click)="confirm.close(false)"
    >
      <span>{{ 'common.cancel' | translate }}</span>
    </button>
    <button
      class="app-btn app-btn-sm"
      [class.app-btn-danger]="request?.severity === 'danger'"
      (click)="confirm.close(true)"
    >
      <i [class]="request?.acceptIcon ?? 'pi pi-check'" aria-hidden="true"></i>
      <span>{{ request?.acceptLabel ?? ('common.confirm' | translate) }}</span>
    </button>
  </div>
</app-dialog>
