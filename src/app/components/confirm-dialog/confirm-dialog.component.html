@let request = confirm.request();
<app-dialog
  [header]="request?.header ?? ''"
  [open]="!!request"
  (openChange)="onOpenChange($event)"
  width="360px"
>
  <p class="confirm-text">{{ request?.message }}</p>
  <div dialogFooter class="dialog-actions">
    <button
      pButton
      size="small"
      severity="secondary"
      [text]="true"
      [label]="'common.cancel' | translate"
      (click)="confirm.close(false)"
    ></button>
    <button
      pButton
      size="small"
      [severity]="request?.severity === 'danger' ? 'danger' : undefined"
      [icon]="request?.acceptIcon ?? 'pi pi-check'"
      [label]="request?.acceptLabel ?? ('common.confirm' | translate)"
      (click)="confirm.close(true)"
    ></button>
  </div>
</app-dialog>
