<app-dialog
  #dialog
  [open]="!!product"
  (openChange)="!$event && close()"
  [closable]="!saving"
  [header]="header | translate"
  width="420px"
>
  @if (product) {
    <form class="pd" (ngSubmit)="save()">
      <div class="pd-product">
        <img class="pd-img" [src]="product.url" [alt]="product.label" />
        <span class="pd-label">{{ product.label }}</span>
      </div>

      <div class="pd-field">
        <label for="productDetailsLabel">{{ "common.name" | translate }}</label>
        <input
          class="app-input"
          id="productDetailsLabel"
          name="label"
          type="text"
          [(ngModel)]="label"
          [placeholder]="'common.designNamePlaceholder' | translate"
        />
      </div>

      <div class="pd-field">
        <label for="productDetailsCategory">{{ "common.category" | translate }}</label>
        <app-select
          inputId="productDetailsCategory"
          name="category"
          [options]="categories"
          [(ngModel)]="categoryId"
          optionLabel="label"
          optionValue="_id"
          [placeholder]="'common.selectCategory' | translate"
          [filter]="categories.length > 8"
          [showClear]="!!categoryId"
          [fluid]="true"
        >
          <ng-template #selectedItem let-category>
            {{ category.label | translate }}
          </ng-template>
          <ng-template #item let-category>
            {{ category.label | translate }}
          </ng-template>
        </app-select>
      </div>

      <div class="pd-field">
        <label for="productDetailsTags">{{ "common.tags" | translate }}</label>
        <app-product-tags inputId="productDetailsTags" [(tags)]="tags" />
      </div>

      @if (failed) {
        <p class="pd-error" role="alert">
          <i class="pi pi-exclamation-triangle"></i>
          {{ "gallery.detailsFailed" | translate }}
        </p>
      }
    </form>
  }

  <div dialogFooter class="dialog-actions">
    <button
      type="button"
      class="app-btn app-btn-secondary app-btn-text"
      [disabled]="saving"
      (click)="close()"
    >
      <span>{{ 'common.cancel' | translate }}</span>
    </button>
    <button
      type="button"
      class="app-btn"
      [disabled]="saving || !canSave"
      (click)="save()"
    >
      <i [class]="saving ? 'pi pi-spin pi-spinner' : 'pi pi-check'" aria-hidden="true"></i>
      <span>{{ 'common.save' | translate }}</span>
    </button>
  </div>
</app-dialog>
