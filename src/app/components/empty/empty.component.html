<app-icon class="empty-icon" size="xl" [icon]="icon" />
@if (title) {
  <p class="empty-title">{{ title }}</p>
}
@if (description) {
  <p class="empty-description">{{ description }}</p>
}
@if (buttonLabel) {
  <button
    class="app-btn app-btn-sm"
    (click)="doAction.emit()"
  >
    <i [class]="buttonIcon" aria-hidden="true"></i>
    <span>{{ buttonLabel }}</span>
  </button>
}
