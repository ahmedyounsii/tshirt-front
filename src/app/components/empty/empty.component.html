<app-icon class="empty-icon" size="xl" [icon]="icon" />
@if (title) {
  <p class="empty-title">{{ title }}</p>
}
@if (description) {
  <p class="empty-description">{{ description }}</p>
}
@if (buttonLabel) {
  <button
    pButton
    size="small"
    [label]="buttonLabel"
    [icon]="buttonIcon"
    (click)="doAction.emit()"
  ></button>
}
