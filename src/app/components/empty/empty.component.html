<span class="empty-icon">
  <i [class]="icon"></i>
</span>
@if (title) {
  <p class="empty-title">{{ title }}</p>
}
@if (description) {
  <p class="empty-description">{{ description }}</p>
}
@if (buttonLabel) {
  <button
    pButton
    size="small"
    [label]="buttonLabel"
    [icon]="buttonIcon"
    (click)="doAction.emit()"
  ></button>
}
