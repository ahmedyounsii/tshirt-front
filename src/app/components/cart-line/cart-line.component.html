<button
  type="button"
  class="line-thumb"
  [attr.aria-label]="'shopNow.preview' | translate"
  [title]="'shopNow.preview' | translate"
  (click)="previewer.open(item.product)"
>
  <img
    [src]="item.product.url"
    [alt]="item.product.label"
    loading="lazy"
    decoding="async"
  />
  @if (!editable) {
    <span class="line-thumb-qty">{{ item.quantity }}</span>
  }
  <span class="line-thumb-zoom" aria-hidden="true">
    <i class="pi pi-search-plus"></i>
  </span>
</button>

<div class="line-info">
  <div class="line-head">
    <h4 class="line-title" [title]="item.product.label">
      {{ item.product.label }}
    </h4>
    @if (editable) {
      <button
        type="button"
        class="app-btn app-btn-sm app-btn-danger app-btn-text line-remove app-btn-icon-only"
        [attr.aria-label]="
          'cart.remove' | translate: { label: item.product.label }
        "
        [title]="'common.remove' | translate"
        (click)="cart.remove(item)"
      >
        <i class="pi pi-trash" aria-hidden="true"></i>
      </button>
    }
  </div>

  <p class="line-meta">
    <span class="line-size">{{ "cart.size" | translate }} {{ item.size }}</span>
    @if (template; as t) {
      <span class="line-swatch" [style.background]="t.color"></span>
      {{ "templates.styles." + (t.style || t.type) | translate }}
    }
  </p>

  <div class="line-foot">
    @if (editable) {
      <app-qty-stepper
        size="small"
        [value]="item.quantity"
        [min]="0"
        [max]="maxQuantity"
        [removable]="true"
        (valueChange)="onQuantity($event)"
      />
    } @else {
      <span class="line-unit">
        {{ item.quantity }} × <app-sale-price [product]="item.product" [badge]="false" />
      </span>
    }
    <app-sale-price class="line-total" [product]="item.product" [quantity]="item.quantity" />
  </div>
</div>
