@if (deletable) {
  <!-- Admin: how many products use the design, across the corner from the delete button -->
  <div class="design-card-used-corner">
    <ng-container *ngTemplateOutlet="usedBadge" />
  </div>
  <button
    pButton
    size="small"
    severity="danger"
    [outlined]="true"
    class="design-card-delete"
    [title]="'designsGallery.deleteDesign' | translate"
    [disabled]="deleting"
    (click)="remove.emit(design)"
    [icon]="deleting ? 'pi pi-spinner pi-spin' : 'pi pi-trash'"
  ></button>
}
<img
  class="design-card-img"
  [src]="design.url"
  [alt]="design.label || ''"
  (click)="open.emit(design)"
  loading="lazy"
  decoding="async"
/>
<ng-template #usedBadge>
  <app-tag
    class="design-card-used"
    variant="outlined"
    [size]="usable ? 'md' : 'sm'"
    icon="pi pi-tag"
    [title]="
      'designsGallery.usedTitle' | translate: { count: design.usedCount ?? 0 }
    "
  >
    {{ design.usedCount ?? 0 }}
  </app-tag>
</ng-template>
@if (usable) {
  <div class="design-card-footer">
    <ng-container *ngTemplateOutlet="usedBadge" />
    <p-button
      [label]="'designsGallery.useIt' | translate"
      size="small"
      styleClass="design-card-use"
      (onClick)="use.emit(design)"
    />
  </div>
}
